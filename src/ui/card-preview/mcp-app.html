<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Card Preview</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 320px;
        height: 205px;
        border-radius: 14px;
        background: #6b7280;
        color: #fff;
        overflow: hidden;
        transition: background 0.2s ease;
      }
      /* Left of centre, ~30% down — where the EMV contact field sits on a
         real ID-1 card. */
      .chip {
        position: absolute;
        left: 28px;
        top: 62px;
        width: 46px;
        height: 36px;
      }
      /* Own full-width line so it never wraps against the badge. */
      .number {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 46px;
        font-size: 17px;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      /* Self-contained network badge, framed on white so it reads on any card
         colour. Hidden when the network is unrecognised (empty logo layer). */
      .badge {
        position: absolute;
        right: 20px;
        bottom: 16px;
        box-sizing: border-box;
        width: 52px;
        height: 33px;
        padding: 3px;
        border-radius: 6px;
        background: #fff;
      }
      .badge:empty {
        display: none;
      }
      .badge svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card" aria-label="Card preview">
      <svg
        class="chip"
        viewBox="0 0 46 36"
        role="img"
        aria-label="EMV chip"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="chip-gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6e7b0" />
            <stop offset="0.5" stop-color="#d9b24c" />
            <stop offset="1" stop-color="#b07d16" />
          </linearGradient>
        </defs>
        <rect
          x="0.75"
          y="0.75"
          width="44.5"
          height="34.5"
          rx="5"
          fill="url(#chip-gold)"
          stroke="#a97b1e"
          stroke-width="1"
        />
        <g fill="none" stroke="#8a6a1e" stroke-width="1.3" opacity="0.8">
          <rect x="15" y="12" width="16" height="12" rx="2" />
          <path d="M15 0V12M31 0V12M15 24V36M31 24V36" />
          <path d="M0 12H15M0 24H15M31 12H46M31 24H46" />
        </g>
        <rect
          x="3.5"
          y="3.5"
          width="39"
          height="29"
          rx="3"
          fill="none"
          stroke="rgba(255, 255, 255, 0.25)"
        />
      </svg>
      <div class="number" id="number">
        &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull;
        &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull;
      </div>
      <div class="badge" id="logo"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
